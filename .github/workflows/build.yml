name: Build linux-pipa-strawberry (Thin LTO)

on:
  push:
    branches: [main]
    paths:
      - 'linux-pipa-strawberry/**'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    paths:
      - 'linux-pipa-strawberry/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native aarch64, free for public repos

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Generate PKGBUILD ───────────────────────────────────────────────────
      # Modules-only main package (no Image/dtbs — those go in boot.img).
      # Headers package unchanged. Patches auto-injected from patches/ dir.
      - name: Generate patched PKGBUILD
        run: |
          python3 - <<'PYEOF'
          import os, glob, shutil, textwrap

          pkg_dir     = "linux-pipa-strawberry"
          patches_dir = os.path.join(pkg_dir, "patches")

          patch_names = []
          if os.path.isdir(patches_dir):
              for p in sorted(glob.glob(os.path.join(patches_dir, "*.patch"))):
                  fname = os.path.basename(p)
                  dest  = os.path.join(pkg_dir, fname)
                  if not os.path.exists(dest):
                      shutil.copy(p, dest)
                  patch_names.append(fname)
                  print(f"  Patch: {fname}")
          if not patch_names:
              print("  No patches — vanilla build")

          source_patches = "".join(f"\n        '{n}'"  for n in patch_names)
          sum_patches    = "".join(f"\n         'SKIP'" for _ in patch_names)
          apply_patches  = "".join(
              f"\n  patch -Np1 -i \"${{srcdir}}/{n}\""
              for n in patch_names
          )

          pkgbuild = """\
          buildarch=8

          pkgbase=linux-pipa-strawberry
          _branch="pipa/7.1.7-Stable"
          _srcname="linux-7.xx-pipa-7.1.7-Stable"
          _kernelname=${pkgbase#linux}
          _desc="Kernel for Xiaomi Pad 6 (pipa) — rmuxnet/linux-7.xx pipa/7.1.7-Stable, Thin LTO"
          pkgver=7.1.7
          pkgrel=1
          arch=('aarch64')
          url="https://github.com/rmuxnet/linux-7.xx"
          license=('GPL2')
          makedepends=('xmlto' 'docbook-xsl' 'kmod' 'inetutils' 'bc' 'git'
                       'uboot-tools' 'dtc' 'clang' 'lld' 'llvm')
          options=('!strip')
          _config="config-qcom-sm8250-pipa.aarch64"
          source=("$url/archive/refs/heads/$_branch.tar.gz"
                  'config-qcom-sm8250-pipa.aarch64'
                  'linux-pipa.preset'
                  'cmdline.txt'SOURCE_PATCHES)
          sha512sums=('SKIP'
                   '6af41b947ef1fc3caab153d0324fca58dbd7a35e9876629aeca347ce717d80babbecb964f8cc2afc9aff8151246a094f6dcee438139e9cf97e8d573cd0346726'
                   '78e5f43b582438e1e1c30948a099f751f91c756d0b35414f734587680e09f7c1b6ff5c137b2027526818f6a26278981d77d2ed45f9a4f198a14d5e68f6beab2d'
                   '6e1d9dffd460e4f4bffd00673045e32c01d47529de0da8246ee0eea60e1bd60f9fcccf12a69e75dd96195b91c19c4834a98052b8720b84b8e7bbd3b1f27d5b84'SUM_PATCHES)

          prepare() {
            cd $_srcname

            echo "Setting version..."
            echo "-$pkgrel" > localversion.10-pkgrel
            echo "${pkgbase#linux}" > localversion.20-pkgname

            cat "${srcdir}/$_config" > ./.config

            # Thin LTO
            scripts/config --disable CONFIG_LTO_NONE
            scripts/config --disable CONFIG_LTO_CLANG_FULL
            scripts/config --enable  CONFIG_LTO_CLANG
            scripts/config --enable  CONFIG_LTO_CLANG_THIN
            make ARCH=arm64 LLVM=1 olddefconfigAPPLY_PATCHES
          }

          build() {
            cd ${_srcname}

            make ARCH=arm64 LLVM=1 prepare
            make ARCH=arm64 LLVM=1 -s kernelrelease > version

            unset LDFLAGS
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) ${MAKEFLAGS} Image Image.gz modules
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 ${MAKEFLAGS} DTC_FLAGS="-@" dtbs
          }

          # ── Modules-only package (no Image/dtbs — those live in boot.img) ──
          _package() {
            pkgdesc="Kernel modules for Xiaomi Pad 6 (pipa) - ${_desc}"
            depends=(
              'linux-firmware-pipa-adreno' 'linux-firmware-pipa-adsp'
              'linux-firmware-pipa-cdsp'   'linux-firmware-pipa-awinic'
              'linux-firmware-pipa-nuvolta' 'linux-firmware-pipa-novatek'
              'linux-firmware-pipa-hexagonfs' 'linux-firmware-pipa-slpi'
              'linux-firmware-pipa-venus' 'coreutils' 'linux-firmware'
              'linux-firmware-qcom' 'kmod' 'mkinitcpio>=0.7')
            optdepends=('wireless-regdb: to set the correct wireless channels of your country')
            provides=("linux=${pkgver}")
            conflicts=('linux')

            cd $_srcname
            local kernver="$(<version)"
            local modulesdir="$pkgdir/usr/lib/modules/$kernver"

            # Modules only — Image and dtbs are in boot.img
            make ARCH=arm64 LLVM=1 \
              INSTALL_MOD_PATH="$pkgdir/usr" \
              INSTALL_MOD_STRIP=1 \
              DEPMOD=/doesnt/exist \
              modules_install
            rm "$modulesdir/build"

            # mkinitcpio preset + trigger (needed for initramfs rebuild on device)
            local _subst="s|%PKGBASE%|${pkgbase}|g; s|%KERNVER%|${kernver}|g"
            sed "$_subst" ../linux-pipa.preset |
              install -Dm644 /dev/stdin "${pkgdir}/etc/mkinitcpio.d/${pkgbase}.preset"
            install -d "${pkgdir}/usr/lib/initcpio/"
            echo "dummy" > "${pkgdir}/usr/lib/initcpio/$(<version)"
          }

          # ── Headers package ────────────────────────────────────────────────
          _package-headers() {
            pkgdesc="Header files and scripts for building modules - ${_desc}"
            provides=("linux-headers=${pkgver}")
            conflicts=('linux-headers')

            cd $_srcname
            local builddir="$pkgdir/usr/lib/modules/$(<version)/build"

            install -Dt "$builddir" -m644 \\
              .config Makefile Module.symvers System.map localversion.* version vmlinux
            install -Dt "$builddir/kernel"     -m644 kernel/Makefile
            install -Dt "$builddir/arch/arm64" -m644 arch/arm64/Makefile
            cp -t "$builddir" -a scripts
            mkdir -p "$builddir"/{fs/xfs,mm}
            cp -t "$builddir" -a include
            cp -t "$builddir/arch/arm64" -a arch/arm64/include
            install -Dt "$builddir/arch/arm64/kernel" -m644 arch/arm64/kernel/asm-offsets.s
            mkdir -p "$builddir/arch/arm"
            cp -t "$builddir/arch/arm" -a arch/arm/include
            install -Dt "$builddir/drivers/md"                     -m644 drivers/md/*.h
            install -Dt "$builddir/net/mac80211"                   -m644 net/mac80211/*.h
            install -Dt "$builddir/drivers/media/i2c"              -m644 drivers/media/i2c/msp3400-driver.h
            install -Dt "$builddir/drivers/media/usb/dvb-usb"      -m644 drivers/media/usb/dvb-usb/*.h
            install -Dt "$builddir/drivers/media/dvb-frontends"    -m644 drivers/media/dvb-frontends/*.h
            install -Dt "$builddir/drivers/media/tuners"           -m644 drivers/media/tuners/*.h
            install -Dt "$builddir/drivers/iio/common/hid-sensors" -m644 drivers/iio/common/hid-sensors/*.h
            find . -name 'Kconfig*' -exec install -Dm644 {} "$builddir/{}" \\;
            for arch in "$builddir"/arch/*/; do
              [[ $arch = */arm64/ || $arch = */arm/ ]] && continue
              rm -r "$arch"
            done
            rm -r "$builddir/Documentation"
            find -L "$builddir" -type l -delete
            find "$builddir" -type f -name '*.o' -delete
            mkdir -p "$pkgdir/usr/src"
            ln -sr "$builddir" "$pkgdir/usr/src/$pkgbase"
          }

          pkgname=("${pkgbase}" "${pkgbase}-headers")
          for _p in ${pkgname[@]}; do
            eval "package_${_p}() { _package${_p#${pkgbase}}; }"
          done
          """

          pkgbuild = textwrap.dedent(pkgbuild)
          pkgbuild = pkgbuild.replace("SOURCE_PATCHES", source_patches)
          pkgbuild = pkgbuild.replace("SUM_PATCHES",    sum_patches)
          pkgbuild = pkgbuild.replace("APPLY_PATCHES",  apply_patches)

          with open(os.path.join(pkg_dir, "PKGBUILD"), "w") as f:
              f.write(pkgbuild)
          print("PKGBUILD written")
          PYEOF

      # ── Build in Arch Linux ARM Docker (native aarch64) ─────────────────────
      # Also copies Image.gz + pipa DTB out of the build tree for boot.img step
      - name: Build with makepkg
        run: |
          docker run --rm \
            --volume "$PWD/linux-pipa-strawberry:/pkg" \
            --workdir /pkg \
            menci/archlinuxarm \
            bash -c '
              set -e
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed \
                base-devel clang lld llvm \
                xmlto docbook-xsl kmod inetutils \
                bc git uboot-tools dtc

              useradd -m builder
              chown -R builder /pkg
              su builder -c "makepkg -s --noconfirm"

              # Copy kernel image + pipa DTB out for boot.img creation
              SRCDIR=/pkg/src/linux-7.xx-pipa-7.1.7-Stable
              cp "$SRCDIR/arch/arm64/boot/Image.gz" /pkg/Image.gz

              # Find pipa DTB (needed to append to Image.gz for ABL)
              DTB=$(find "$SRCDIR/arch/arm64/boot/dts" \
                -name "sm8250-xiaomi-pipa.dtb" 2>/dev/null | head -1)
              if [ -n "$DTB" ]; then
                cp "$DTB" /pkg/sm8250-xiaomi-pipa.dtb
                echo "DTB found: $DTB"
              else
                echo "Warning: pipa DTB not found — boot.img will use Image.gz only"
              fi

              chmod -R a+r /pkg/*.pkg.tar.zst /pkg/Image.gz 2>/dev/null || true

              echo "==> Packages:"
              ls -lh /pkg/*.pkg.tar.zst
            '

      # ── Create boot.img ─────────────────────────────────────────────────────
      # Downloads the existing armtix boot image to reuse its ramdisk and
      # all header parameters, then repacks with the freshly built kernel.
      - name: Install boot image tools
        run: sudo apt-get install -y abootimg

      - name: Download existing armtix boot image
        run: |
          wget -q \
            https://github.com/Neo10e/armtix-xiaomi-pipa/releases/download/2026-08-13/armtix-pipa-boot-20260813.img \
            -O existing-boot.img
          echo "Downloaded: $(ls -lh existing-boot.img)"

      - name: Build boot.img
        run: |
          mkdir -p boot-unpacked
          cd boot-unpacked

          # Unpack existing boot image → bootimg.cfg + zImage + initrd.img
          abootimg -x ../existing-boot.img
          echo "==> Unpacked boot params:"
          cat bootimg.cfg

          # Append pipa DTB to Image.gz if available (required by ABL on SM8250)
          IMGDIR="../linux-pipa-strawberry"
          if [ -f "$IMGDIR/sm8250-xiaomi-pipa.dtb" ]; then
            cat "$IMGDIR/Image.gz" "$IMGDIR/sm8250-xiaomi-pipa.dtb" > kernel-dtb.gz
            KERNEL="kernel-dtb.gz"
            echo "==> Using Image.gz + appended DTB"
          else
            KERNEL="$IMGDIR/Image.gz"
            echo "==> Using Image.gz only (no DTB found)"
          fi

          # Repack with new kernel, keep everything else from original
          abootimg --create ../boot.img \
            -f bootimg.cfg \
            -k "$KERNEL" \
            -r initrd.img

          cd ..
          echo "==> boot.img: $(ls -lh boot.img)"

      # ── Create null DTBO ────────────────────────────────────────────────────
      # Valid empty DTBO header — ABL requires this partition to not be
      # fully zeroed, but with zero entries so no overlays are applied.
      - name: Create null-dtbo.img
        run: |
          python3 - <<'PYEOF'
          import struct
          # Magic 0xd7b7ab1e (big-endian), then: total_size, header_size,
          # dt_entry_size, dt_entry_count, dt_entries_offset, page_size, version
          header = struct.pack('>8I', 0xd7b7ab1e, 32, 32, 32, 0, 32, 2048, 0)
          with open('null-dtbo.img', 'wb') as f:
              f.write(header)
          print(f"null-dtbo.img: {len(header)} bytes")
          PYEOF

      # ── Upload all artifacts ─────────────────────────────────────────────────
      # Produces:
      #   linux-pipa-strawberry-*.pkg.tar.zst         ← modules + preset
      #   linux-pipa-strawberry-headers-*.pkg.tar.zst ← kernel headers
      #   boot.img                                     ← flash or fastboot boot
      #   null-dtbo.img                               ← flash to dtbo_a + dtbo_b
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-pipa-strawberry-${{ github.run_number }}-${{ github.sha }}
          retention-days: 14
          path: |
            linux-pipa-strawberry/linux-pipa-strawberry-*.pkg.tar.zst
            boot.img
            null-dtbo.img
