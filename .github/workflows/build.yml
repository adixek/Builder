name: Build linux-pipa-strawberry (Thin LTO)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native aarch64 — free for public repos

    steps:

      # ── Clone PKGBUILDs repo ─────────────────────────────────────────────────
      - name: Clone PKGBUILDs-pipa
        run: git clone https://github.com/Neo10e/PKGBUILDs-pipa.git

      # ── Patch PKGBUILD: linux-7.xx repo + pipa/7.1.7-Stable branch ──────────
      - name: Patch PKGBUILD for linux-7.xx
        run: |
          set -e
          PKGBUILD="PKGBUILDs-pipa/linux-pipa-strawberry/PKGBUILD"
          CONFIG="PKGBUILDs-pipa/linux-pipa-strawberry/config-qcom-sm8250-pipa.aarch64" 

          # Repo URL: rmuxnet/linux  ->  rmuxnet/linux-7.xx
          sed -i 's|url="https://github.com/rmuxnet/linux"|url="https://github.com/rmuxnet/linux-7.xx"|' "$PKGBUILD"

          # Branch:   pipa/7.1.7     ->  pipa/7.1.7-Stable
          sed -i 's|_branch="pipa/7.1.7"|_branch="pipa/7.1.7-Stable"|' "$PKGBUILD"

          # Extract dir (GitHub names it <repo>-<branch with / -> ->):
          #           linux-pipa-7.1.7  ->  linux-7.xx-pipa-7.1.7-Stable
          sed -i 's|_srcname="linux-pipa-7.1.7"|_srcname="linux-7.xx-pipa-7.1.7-Stable"|' "$PKGBUILD"

          echo "==> PKGBUILD patched:"
          grep -E '^(url|_branch|_srcname)=' "$PKGBUILD"

          # Disable kb as it is causing error
          sed -i 's|CONFIG_KEYBOARD_XIAOMI_NANOSIC803=m|# CONFIG_KEYBOARD_XIAOMI_NANOSIC803 is not set|' "$CONFIG"

      # ── Build with makepkg inside Arch Linux ARM container ───────────────────
      - name: Build with makepkg
        run: |
          docker run --rm \
            --volume "$PWD/PKGBUILDs-pipa/linux-pipa-strawberry:/pkg" \
            --workdir /pkg \
            menci/archlinuxarm \
            bash -c '
              set -e

              # Disable pacman Landlock sandbox — required in unprivileged containers
              # (pacman 6.1+ uses kernel Landlock which GitHub Actions runners block)
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf

              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed \
                base-devel clang lld llvm \
                xmlto docbook-xsl kmod inetutils \
                bc git uboot-tools dtc

              useradd -m builder
              chown -R builder /pkg
              su builder -c "makepkg -s --noconfirm"

              cp "$SRCDIR/arch/arm64/boot/Image.gz" /pkg/Image.gz

              DTB=$(find "$SRCDIR/arch/arm64/boot/dts" \
                -name "sm8250-xiaomi-pipa.dtb" 2>/dev/null | head -1)
              if [ -n "$DTB" ]; then
                cp "$DTB" /pkg/sm8250-xiaomi-pipa.dtb
                echo "==> DTB: $DTB"
              else
                echo "==> WARNING: pipa DTB not found"
              fi

              chmod -R a+r /pkg/*.pkg.tar.zst /pkg/Image.gz 2>/dev/null || true
              echo "==> Packages:"
              ls -lh /pkg/*.pkg.tar.zst
            '

      # ── Install mkbootimg ────────────────────────────────────────────────────
      - name: Install mkbootimg tools
        run: pip3 install mkbootimg --break-system-packages

      # ── Download reference armtix boot image ─────────────────────────────────
      - name: Download armtix boot image
        run: |
          wget -q \
            https://github.com/Neo10e/armtix-xiaomi-pipa/releases/download/2026-08-13/armtix-pipa-boot-20260813.img \
            -O existing-boot.img
          echo "==> $(ls -lh existing-boot.img | awk '{print $5}')"
          unpack_bootimg --boot_img existing-boot.img --format mkbootimg || true

      # ── Build boot.img ────────────────────────────────────────────────────────
      - name: Build boot.img
        run: |
          set -e
          mkdir -p boot-unpacked

          unpack_bootimg --boot_img existing-boot.img --out boot-unpacked/
          BOOT_ARGS=$(unpack_bootimg --boot_img existing-boot.img --format mkbootimg)

          IMGDIR="PKGBUILDs-pipa/linux-pipa-strawberry"
          if [ -f "$IMGDIR/sm8250-xiaomi-pipa.dtb" ]; then
            cat "$IMGDIR/Image.gz" "$IMGDIR/sm8250-xiaomi-pipa.dtb" > kernel-dtb.gz
            NEW_KERNEL="$(pwd)/kernel-dtb.gz"
            echo "==> Kernel: Image.gz + pipa DTB"
          else
            NEW_KERNEL="$(pwd)/$IMGDIR/Image.gz"
            echo "==> WARNING: no DTB — Image.gz only"
          fi

          RAMDISK=""
          for f in boot-unpacked/ramdisk boot-unpacked/ramdisk.lz4 boot-unpacked/ramdisk.gz; do
            [ -f "$f" ] && RAMDISK="$(pwd)/$f" && break
          done
          [ -n "$RAMDISK" ] || { echo "ERROR: ramdisk not found"; exit 1; }

          BOOT_ARGS_FILTERED=$(echo "$BOOT_ARGS" \
            | sed 's|--kernel [^ ]*||g' \
            | sed 's|--ramdisk [^ ]*||g')

          eval mkbootimg \
            --kernel  "\"$NEW_KERNEL\"" \
            --ramdisk "\"$RAMDISK\""   \
            $BOOT_ARGS_FILTERED        \
            --output boot.img

          echo "==> boot.img: $(ls -lh boot.img | awk '{print $5}')"
          unpack_bootimg --boot_img boot.img --format mkbootimg || true

      # ── Create null DTBO ──────────────────────────────────────────────────────
      - name: Create null-dtbo.img
        run: |
          python3 - <<'PYEOF'
          import struct
          header = struct.pack('>8I',
              0xd7b7ab1e, 32, 32, 32, 0, 32, 2048, 0)
          open('null-dtbo.img', 'wb').write(header)
          print("null-dtbo.img: " + str(len(header)) + " bytes")
          PYEOF

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-pipa-strawberry-${{ github.run_number }}-${{ github.sha }}
          retention-days: 14
          path: |
            PKGBUILDs-pipa/linux-pipa-strawberry/linux-pipa-strawberry-*.pkg.tar.zst
            boot.img
            null-dtbo.img
